<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeHub | Local Classifieds & Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        .view-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .active-view { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center cursor-pointer" onclick="switchView('home-view')">
                    <i class="fa-solid fa-bolt text-blue-600 text-2xl mr-2"></i>
                    <span class="font-bold text-2xl tracking-tight text-gray-900">TradeHub</span>
                </div>
                <div class="hidden md:flex flex-1 mx-8">
                    <div class="w-full relative">
                        <input type="text" placeholder="Find cars, mobile phones and more..." class="w-full border border-gray-300 rounded-md py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button class="absolute right-0 top-0 h-full px-4 text-gray-500 hover:text-blue-600">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="font-medium text-gray-700 hover:text-blue-600">Login</button>
                    <button onclick="switchView('post-ad-view')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-full shadow-md transition duration-200">
                        <i class="fa-solid fa-plus mr-1"></i> SELL
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main id="home-view" class="view-section active-view max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8 flex space-x-4 overflow-x-auto pb-2">
            <button class="flex items-center space-x-2 bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200 hover:border-blue-500 whitespace-nowrap">
                <i class="fa-solid fa-car text-gray-600"></i><span>Vehicles</span>
            </button>
            <button class="flex items-center space-x-2 bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200 hover:border-blue-500 whitespace-nowrap">
                <i class="fa-solid fa-mobile-screen text-gray-600"></i><span>Electronics</span>
            </button>
            <button class="flex items-center space-x-2 bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200 hover:border-blue-500 whitespace-nowrap">
                <i class="fa-solid fa-briefcase text-gray-600"></i><span>B2B Consulting</span>
            </button>
            <button class="flex items-center space-x-2 bg-white px-4 py-2 rounded-full shadow-sm border border-gray-200 hover:border-blue-500 whitespace-nowrap">
                <i class="fa-solid fa-print text-gray-600"></i><span>Print & Services</span>
            </button>
        </div>

        <h2 class="text-2xl font-bold mb-6 text-gray-800">Fresh Recommendations</h2>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="ad-grid">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden hover:shadow-lg transition duration-200 cursor-pointer">
                <div class="h-48 bg-gray-200 flex items-center justify-center">
                    <i class="fa-solid fa-print text-4xl text-gray-400"></i>
                </div>
                <div class="p-4">
                    <h3 class="text-xl font-bold text-gray-900">₹ 450</h3>
                    <p class="text-sm text-gray-600 mt-1 line-clamp-2">Laserworld Xerox Surplus High-Speed Paper</p>
                    <div class="flex justify-between items-center mt-4 text-xs text-gray-500">
                        <span>83/1 Linton Street, Kolkata</span>
                        <span>TODAY</span>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden hover:shadow-lg transition duration-200 cursor-pointer">
                <div class="h-48 bg-gray-200 flex items-center justify-center">
                    <i class="fa-solid fa-trowel-bricks text-4xl text-gray-400"></i>
                </div>
                <div class="p-4">
                    <h3 class="text-xl font-bold text-gray-900">Custom Quote</h3>
                    <p class="text-sm text-gray-600 mt-1 line-clamp-2">Shivam Construction - Commercial Contracting</p>
                    <div class="flex justify-between items-center mt-4 text-xs text-gray-500">
                        <span>Kolkata Region</span>
                        <span>YESTERDAY</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <main id="post-ad-view" class="view-section max-w-3xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-md border border-gray-200 p-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-gray-800">Post Your Ad</h2>
                <button onclick="switchView('home-view')" class="text-gray-400 hover:text-red-500">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            
            <form id="ad-form" onsubmit="submitAd(event)">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ad Title</label>
                        <input type="text" id="ad-title" required class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Price (₹)</label>
                        <input type="number" id="ad-price" required class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                        <select id="ad-category" class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option>Services & Consulting</option>
                            <option>Electronics</option>
                            <option>Vehicles</option>
                            <option>B2B Wholesale</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea id="ad-desc" rows="4" required class="w-full border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-md border border-blue-100 flex items-start">
                        <i class="fa-solid fa-shield-halved text-blue-500 mt-1 mr-3"></i>
                        <p class="text-sm text-blue-800"><strong>Velocity Firewall Active:</strong> Free tier users are limited to 1 post per 24 hours.</p>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md shadow transition duration-200">
                        Deploy Ad to Grid
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            window.scrollTo(0, 0);
        }

        async function submitAd(event) {
            event.preventDefault();
            alert('Success: Ad successfully deployed to TradeHub! (Simulated)');
            switchView('home-view');
            document.getElementById('ad-form').reset();
        }
    </script>
</body>
</html>
